{% extends 'base.html' %}

{% block title %}Вход в аккаунт{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="auth-card">
            <h1 class="h3 text-center mb-4">Вход в аккаунт</h1>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger">Неверное имя пользователя или пароль.</div>
                {% endif %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Имя пользователя</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-accent w-100">Войти</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'users:register' %}">Нет аккаунта? Зарегистрируйтесь</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
